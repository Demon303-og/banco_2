services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: banco, POSTGRES_PASSWORD: banco, POSTGRES_DB: banco }
    volumes: [dbdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    environment: { DB_HOST: db, DB_NAME: banco, DB_USER: banco, DB_PASSWORD: banco }
    depends_on: [db]
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:8080"]
volumes:
  dbdata:

apiVersion: apps/v1
kind: Deployment
metadata: { name: backend }
spec:
  replicas: 2
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
      - name: backend
        # Reemplaza "banco" por el nombre de tu proyecto en OpenShift
        image: image-registry.openshift-image-registry.svc:5000/banco/backend:latest
        ports: [{ containerPort: 8000 }]
        env:
        - { name: DB_HOST, value: postgres }
        - { name: DB_USER, valueFrom: { secretKeyRef: { name: db-secret, key: DB_USER } } }
        - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: db-secret, key: DB_PASSWORD } } }
        - { name: DB_NAME, valueFrom: { secretKeyRef: { name: db-secret, key: DB_NAME } } }
        readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 5 }
        livenessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 15 }
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: backend }
spec:
  selector: { app: backend }
  ports: [{ port: 8000 }]
